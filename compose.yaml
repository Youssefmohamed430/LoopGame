services:
  coderunner:
    image: coderunner
    build:
      context: .
      dockerfile: CodeRunner/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CodeRunner__DockerImage=shift-c-runner:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
